# Drop this into a CONSUMER repo at .github/workflows/apidrift.yml
# This is the entire Enterprise integration: one file. The engine runs inside
# your CI on your checkout — your code never leaves your runner.
name: APIdrift

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch: {}     # and on demand

permissions:
  contents: write           # push the fix branch
  pull-requests: write      # open the PR

jobs:
  apidrift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: your-org/apidrift@v1   # <- this repo, published as an action
