name: Release

# Publishes the Free package to npm when you cut a GitHub Release.
# Flow: bump version in package.json -> git tag vX.Y.Z -> create a Release -> this runs.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required by npm publish --provenance (sigstore OIDC)

jobs:
  publish:
    name: build, test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        # --provenance links the tarball to this workflow run and this commit
        # via sigstore, so consumers can verify the package was built from
        # this public repo. It requires `id-token: write` above and a PUBLIC
        # source repo -- sigstore rejects private ones.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
