name: Release

# Publishes the Free package to npm when you cut a GitHub Release.
# Flow: bump version in package.json -> git tag vX.Y.Z -> create a Release -> this runs.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for npm provenance (supply-chain attestation)

jobs:
  publish:
    name: build, test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
