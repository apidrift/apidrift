name: Release

# Publishes the Free package to npm when you cut a GitHub Release.
# Flow: bump version in package.json -> git tag vX.Y.Z -> create a Release -> this runs.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # kept for when provenance can be re-enabled, see below

jobs:
  publish:
    name: build, test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        # No --provenance: npm's sigstore provenance check rejects publishes
        # whose source repo is private ("Unsupported GitHub Actions source
        # repository visibility: private"). Re-add --provenance once this
        # repo is public.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
